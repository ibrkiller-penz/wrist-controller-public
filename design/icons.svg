<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    손목 컨트롤러 아이콘 스프라이트 (design/icons.svg)
    - 24×24 그리드, 선(stroke) 아이콘, 선 두께는 사용하는 쪽(.wc-icon)에서 지정
    - 색은 currentColor 상속 → 부모 color 로 모드색/상태색 적용
    - 사용: <svg class="wc-icon"><use href="icons.svg#i-save"/></svg>
      (file:// 로 직접 열면 브라우저가 외부 use 참조를 막으므로 로컬 서버로 열거나 인라인으로 넣는다)
    - 각 symbol 의 <g> 에 선 속성을 넣어 두어 CSS 없이도 같은 모양으로 보인다.
    - 펌웨어: 이 path 를 48/96px PNG 로 래스터화 → LVGL 이미지 변환기(A8 형식)로 C 배열 생성,
      lv_obj_set_style_image_recolor 로 모드색을 입힌다. (system.md 4절)
  -->

  <!-- 저장 (코딩: Ctrl+S) — 플로피 디스크 -->
  <symbol id="i-save" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h10l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
      <path d="M8 3v5h7V3"/>
      <path d="M7 21v-7h10v7"/>
    </g>
  </symbol>

  <!-- 명령 팔레트 (코딩: Ctrl+Shift+P) — ⌘ 기호 -->
  <symbol id="i-command" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 9V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V9"/>
    </g>
  </symbol>

  <!-- 터미널 열기·닫기 (코딩: Ctrl+`) — 창 안의 프롬프트 -->
  <symbol id="i-terminal" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M7 9l3 3-3 3"/>
      <path d="M13 15h4"/>
    </g>
  </symbol>

  <!-- 디버그 실행 (코딩: F5) — 벌레 -->
  <symbol id="i-debug" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="7" width="8" height="13" rx="4"/>
      <path d="M9.5 7.5L8 4.5M14.5 7.5L16 4.5"/>
      <path d="M4 11h4M16 11h4M4 16h4M16 16h4"/>
      <path d="M12 11v9"/>
    </g>
  </symbol>

  <!-- 주석 토글 (코딩: Ctrl+/) — 두 개의 사선 // -->
  <symbol id="i-comment" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 5L6 19"/>
      <path d="M18 5l-4 14"/>
    </g>
  </symbol>

  <!-- 실행 취소 (코딩: Ctrl+Z) — 되돌아가는 화살표 -->
  <symbol id="i-undo" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 14L4 9l5-5"/>
      <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
    </g>
  </symbol>

  <!-- 마이크 켜짐 (회의) -->
  <symbol id="i-mic" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0"/>
      <path d="M12 18v3"/>
    </g>
  </symbol>

  <!-- 마이크 꺼짐 (회의, 음소거) — 사선 -->
  <symbol id="i-mic-off" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 9.5V6a3 3 0 0 0-5.7-1.3"/>
      <path d="M9 9v2a3 3 0 0 0 5.1 2.1"/>
      <path d="M5 11a7 7 0 0 0 11.6 5.3M19 11a7 7 0 0 1-.6 2.8"/>
      <path d="M12 18v3"/>
      <path d="M3 3l18 18"/>
    </g>
  </symbol>

  <!-- 카메라 켜짐 (회의) — 비디오 카메라 -->
  <symbol id="i-camera" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="14" height="12" rx="2"/>
      <path d="M16 10l6-3.5v11L16 14"/>
    </g>
  </symbol>

  <!-- 카메라 꺼짐 (회의) — 사선 -->
  <symbol id="i-camera-off" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 6h4a2 2 0 0 1 2 2v4"/>
      <path d="M16 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2"/>
      <path d="M16 10l6-3.5v11L16 14"/>
      <path d="M3 3l18 18"/>
    </g>
  </symbol>

  <!-- 손 들기 (회의) — 펼친 손바닥 -->
  <symbol id="i-hand" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 13V6a1.5 1.5 0 0 1 3 0v5"/>
      <path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V11"/>
      <path d="M14 11V6a1.5 1.5 0 0 1 3 0v6"/>
      <path d="M17 10a1.5 1.5 0 0 1 3 0v4a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8l-2.9-3.9a1.6 1.6 0 0 1 2.4-2.1L8 14"/>
    </g>
  </symbol>

  <!-- BLE 연결됨 (상태줄) — 블루투스 룬 -->
  <symbol id="i-ble" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 7l10 10-5 5V2l5 5L7 17"/>
    </g>
  </symbol>

  <!-- BLE 연결 끊김 (상태줄·전체화면) — 룬 + 사선 -->
  <symbol id="i-ble-off" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 17l-5 5V12"/>
      <path d="M12 7.5V2l5 5-2.5 2.5"/>
      <path d="M7 17l5-5"/>
      <path d="M3 3l18 18"/>
    </g>
  </symbol>

  <!-- 배터리 (상태줄) — 외곽만. 잔량 막대는 코드에서 x=4.5 y=9.5 h=5, w=0~11.5 로 채운다 -->
  <symbol id="i-battery" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="7" width="17" height="10" rx="2"/>
      <path d="M22 11v2"/>
    </g>
  </symbol>

  <!-- 잠금 (제스처·음성 잠금) — 자물쇠 -->
  <symbol id="i-lock" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="11" width="14" height="10" rx="2"/>
      <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      <path d="M12 15v2"/>
    </g>
  </symbol>

  <!-- 슬라이드 (발표 모드 표시) — 스탠드 위 화면 -->
  <symbol id="i-slides" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="12" rx="1.5"/>
      <path d="M12 16v4"/>
      <path d="M8 20h8"/>
      <path d="M7 12l3-3 2 2 4-4"/>
    </g>
  </symbol>

  <!-- 쇼 시작 (발표: F5) — 재생 삼각형 -->
  <symbol id="i-play" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 4.5v15l12-7.5z"/>
    </g>
  </symbol>

  <!-- 쇼 종료 (발표: Esc) — 정지 사각형 -->
  <symbol id="i-stop" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="12" height="12" rx="2"/>
    </g>
  </symbol>

  <!-- 설정 — 톱니 (링 + 바깥 톱니 8개) -->
  <symbol id="i-gear" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="6"/>
      <circle cx="12" cy="12" r="2.5"/>
      <path d="M12 2.5V6M12 18v3.5M2.5 12H6M18 12h3.5M5.3 5.3l2.5 2.5M16.2 16.2l2.5 2.5M5.3 18.7l2.5-2.5M16.2 7.8l2.5-2.5"/>
    </g>
  </symbol>

  <!-- 음성 명령 (발표: "키트, 다음") — 음파 막대 -->
  <symbol id="i-voice" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 10v4M8 7v10M12 3v18M16 7v10M20 10v4"/>
    </g>
  </symbol>
</svg>
