# ESP 컴포넌트 레지스트리 의존성 — docs/research/hardware.md 4장, firmware-stack.md 4장
# 버전은 Waveshare 공식 예제 examples/esp-idf/02_lvgl_demo_v9(main/idf_component.yml)와 같게 고정한다.
# (BSP 2.0.0 이 끌어오는 것: waveshare/esp_lcd_sh8601, espressif/esp_lcd_touch_ft5x06, espressif/esp_lvgl_port ^2,
#  esp_codec_dev ~1.5, esp_lcd_panel_io_additions ^1 — 실제 버전은 빌드 때 생기는 dependencies.lock 참고)
dependencies:
  idf: ">=5.5,<6.0"
  # 2단계 2번: Waveshare 공식 C6 BSP — 화면(CO5300, esp_lcd_sh8601 드라이버)·터치(FT3168, ft5x06)·코덱·LVGL 포트
  waveshare/esp32_c6_touch_amoled_2_06: "2.0.0"
  # 2단계 2번: LVGL 9 (공식 예제·공장 펌웨어 9.5.0)
  lvgl/lvgl:
    version: "9.5.0"
    public: true
  # 터치 헤더(esp_lcd_touch.h)를 main 에서도 보이게 — BSP 는 이 컴포넌트를 공개 의존성으로 내보내지 않는다.
  # esp_lvgl_port.h 도 이 헤더가 보일 때만 lvgl_port_add_touch() 를 선언한다. 버전은 BSP 가 고르는 것과 같은 1.x
  espressif/esp_lcd_touch: "^1.2.1"
  # 터치를 BSP 대신 직접 만든다(리셋 뒤 대기 시간을 늘리려고 — display_ui.c). BSP 가 고르는 것과 같은 1.x
  espressif/esp_lcd_touch_ft5x06: "^1.1.1"
  # TODO(2단계 6번): IMU QMI8658 드라이버 — 공장 펌웨어는 qmi8658 컴포넌트 사용(정확한 레지스트리 이름 미확인)
  # 2단계 8번 음성(esp-sr WakeNet·esp-dsp)은 2026-10-17 에 뺐다 — 메모리 부족. 나중 계획은 docs/research/gemini-later.md
